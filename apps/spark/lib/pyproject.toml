[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-etl"
version = "0.1.0"
dependencies = ["pydantic>=2.0", "pyspark>=4.0", "lancedb>=0.13", "pyarrow>=14.0", "google-cloud-storage>=2.0", "pypdf>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
